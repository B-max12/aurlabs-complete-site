# Aur Labs is a Next.js / TypeScript project managed with pnpm.
# Use its native lint and type-check tools rather than Deno linting
# the entire repository (including generated Workers files).
name: Code quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint source code with ESLint
        run: pnpm lint
      - name: Type-check
        run: pnpm exec tsc --noEmit
